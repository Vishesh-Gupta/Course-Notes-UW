name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build notes and website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install TeX Live, pandoc and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures lmodern latexmk \
            texlive-xetex texlive-lang-cjk texlive-lang-chinese fonts-noto-cjk \
            pandoc poppler-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Marginalia
        run: npm ci --no-audit --no-fund

      - name: Cache figures and converted chapters
        uses: actions/cache@v6
        with:
          path: |
            .marginalia/tikz
            .marginalia/pandoc
          key: tikz-${{ hashFiles('common/*.tex', '*/*/main.tex', '*/*/chapters/*.tex') }}
          restore-keys: tikz-

      # PDFs (fails on LaTeX errors, undefined references, missing characters and
      # chapters left out of main.tex), the website (fails on any conversion
      # warning), the search index, and a KaTeX check of every formula.
      - name: Build and check
        run: npx --no-install marginalia check

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notes-pdfs
          path: .marginalia/pdfs/*.pdf
          if-no-files-found: ignore

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site

  release:
    name: Publish PDFs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: notes-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: notes-pdfs
          path: pdfs

      - name: Upload PDFs to the "notes-latest" release
        run: |
          notes="PDFs of every course, built by CI from ${GITHUB_SHA::7}."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Course notes (PDF)" --notes "$notes"
          fi
          gh release upload "$TAG" pdfs/*.pdf --repo "$GITHUB_REPOSITORY" --clobber

  deploy:
    # Cloudflare Pages (free) so the repository can stay private. Needs the
    # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets; without
    # them this job only prints a notice.
    name: Deploy website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      PROJECT: course-notes-uw
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Website not deployed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see README)."
          fi

      - name: Download site
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Create the Pages project (first run only)
        if: steps.secrets.outputs.ok == 'true'
        run: npx -y wrangler@4.20.0 pages project create "$PROJECT" --production-branch=main || true

      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        run: npx -y wrangler@4.20.0 pages deploy site --project-name="$PROJECT" --branch=main --commit-dirty=true
