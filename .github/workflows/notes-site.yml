name: Notes site

on:
  push:
    branches: [main]
    paths:
      - "Computer Science/**"
      - "website/**"
      - ".github/workflows/notes-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc poppler-utils \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures lmodern

      - name: Cache compiled TikZ figures
        uses: actions/cache@v4
        with:
          path: website/.cache
          key: tikz-${{ hashFiles('Computer Science/**/*.tex') }}
          restore-keys: tikz-

      - name: Build site
        run: python3 website/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build search index
        run: npx -y pagefind@1.1.1 --site website/_site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
